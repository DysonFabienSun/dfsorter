name: Windows portable release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Ensure 7-Zip is available for pinned libmpv archive
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:/Program Files/7-Zip/7z.exe')) {
            choco install 7zip --no-progress -y
          }
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ('v' + $version -ne '${{ github.ref_name }}') {
            throw "Tag ${{ github.ref_name }} does not match project version v$version."
          }
      - name: Abort if release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:GITHUB_REF_NAME"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            throw "Release $env:GITHUB_REF_NAME already exists. Aborting."
          }
          if ($response.StatusCode -ne 404) {
            throw "Release lookup failed with HTTP $($response.StatusCode)."
          }
      - name: Build portable ZIP
        shell: pwsh
        run: ./packaging/build-release.ps1 -NoProxy
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' ./build/DFSorter-Windows-x64.zip --title 'DFSorter ${{ github.ref_name }}' --generate-notes --verify-tag --draft
