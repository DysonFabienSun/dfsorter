name: Windows portable release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build into a draft release
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - name: Restore original annotated tag after checkout
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $env:RELEASE_TAG."
          }
          # Checkout can replace the local tag object with its peeled commit.
          git fetch --force origin "refs/tags/${env:RELEASE_TAG}:refs/tags/${env:RELEASE_TAG}"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch original release tag.' }
          $tagCommit = git rev-parse "refs/tags/${env:RELEASE_TAG}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve release tag commit.' }
          $headCommit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) {
            throw 'Checked-out source does not match the release tag.'
          }
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Ensure 7-Zip is available for pinned libmpv archive
        shell: pwsh
        run: |
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue) -and
              -not (Test-Path 'C:/Program Files/7-Zip/7z.exe')) {
            choco install 7zip --no-progress -y
          }
      - name: Verify version tag
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ('v' + $version -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match project version v$version."
          }
      - name: Abort if release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck
          if ($response.StatusCode -eq 200) {
            throw "Release $env:RELEASE_TAG already exists. Aborting."
          }
          if ($response.StatusCode -ne 404) {
            throw "Release lookup failed with HTTP $($response.StatusCode)."
          }
      - name: Read proposed changelog from annotated tag
        shell: pwsh
        run: ./packaging/read-release-notes.ps1 -Tag $env:RELEASE_TAG -OutputPath "$env:RUNNER_TEMP/release-notes.md"
      - name: Build portable ZIP
        shell: pwsh
        run: ./packaging/build-release.ps1 -NoProxy
      - name: Name ZIP for release
        shell: pwsh
        run: Rename-Item -LiteralPath ./build/DFSorter-Windows-x64.zip -NewName "DFSorter-$env:RELEASE_TAG-Windows-x64.zip"
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_TAG" "./build/DFSorter-$env:RELEASE_TAG-Windows-x64.zip" --title "DFSorter $env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/release-notes.md" --verify-tag --draft
