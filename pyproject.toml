[project]
name = "dfsorter"
version = "1.1.8"
description = "Non-destructive gameplay clip catalogue"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.9,<7",
    "python-mpv==1.0.8",
    "PyYAML>=6,<7",
    "ruamel.yaml>=0.18,<0.19",
]

[project.scripts]
dfsorter = "dfsorter.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8",
    "ruff>=0.11",
]
build = [
    "pyinstaller>=6.16,<7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
