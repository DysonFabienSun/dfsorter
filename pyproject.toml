[project]
name = "dfsorter"
version = "0.1.0"
description = "Non-destructive gameplay clip catalogue"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6>=6.9,<7", "PyYAML>=6,<7"]

[project.scripts]
dfsorter = "dfsorter.ui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
